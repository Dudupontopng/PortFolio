<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas</title>
    <style>
        /* --- SEU CSS COMPLETO VEM AQUI --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 16px;
            --bg: #f8f9fa;
            --text: #222222;
            --primary: #005f73;
            --secondary: #0a9396;
            --highlight: #94d2bd;
            --header-bg: #ffffff;
            --shadow: rgba(0, 0, 0, 0.1);
            --danger: #e63946;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        /* Adicionado um tema escuro simples para a calculadora */
        [data-theme='dark'] {
            --bg: #121212;
            --text: #e0e0e0;
            --primary: #bb86fc;
            --secondary: #3700b3;
            --highlight: #6200ee;
            --header-bg: #1f1f1f;
            --shadow: rgba(255, 255, 255, 0.1);
            --danger: #cf6679;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        /* --- ESTILOS PARA O CARD DA CALCULADORA --- */
        .calculator-card {
            background-color: var(--header-bg);
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 8px 24px var(--shadow);
            text-align: center;
            animation: slideUp 0.6s ease-out;
        }

        .calculator-card h1 {
            color: var(--primary);
            margin-bottom: 0.75rem;
            font-size: 2rem;
        }

        .calculator-card p {
            margin-bottom: 2rem;
            line-height: 1.6;
            color: var(--text);
            opacity: 0.8;
        }

        .input-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid var(--highlight);
            background-color: var(--bg);
            color: var(--text);
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }
        
        .input-group input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 95, 115, 0.2);
        }
        
        .btn {
            display: inline-block;
            width: 100%;
            padding: 0.9rem 1.5rem;
            background-color: var(--primary);
            color: #fff;
            text-decoration: none;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        .btn:hover {
            background-color: var(--secondary);
            transform: translateY(-2px);
        }

        #result {
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: bold;
            line-height: 1.5;
            min-height: 80px; /* Evita que o layout pule */
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.3s ease;
        }
        
        /* Classes para colorir os resultados */
        .grade-A { color: #2a9d8f; }
        .grade-B { color: #e9c46a; }
        .grade-C { color: #f4a261; }
        .grade-D { color: #e76f51; }
        .grade-E { color: var(--danger); }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="calculator-card">
            <h1>Calculadora de Média</h1>
            <p>Insira suas duas notas para calcular a média e ver o conceito final.</p>
            
            <form id="gradeForm">
                <div class="input-group">
                    <label for="nota1">Primeira Nota (0 a 10):</label>
                    <input type="number" id="nota1" name="nota1" min="0" max="10" step="0.1" required placeholder="Ex: 8.5">
                </div>
                
                <div class="input-group">
                    <label for="nota2">Segunda Nota (0 a 10):</label>
                    <input type="number" id="nota2" name="nota2" min="0" max="10" step="0.1" required placeholder="Ex: 7.0">
                </div>
                
                <button type="submit" class="btn">Calcular</button>
            </form>

            <div id="result">
                </div>
        </div>
    </div>

    <script>
        // Adiciona um listener para o formulário
        document.getElementById('gradeForm').addEventListener('submit', function(event) {
            // Previne o recarregamento da página ao enviar o formulário
            event.preventDefault(); 
            
            // Pega os valores dos inputs e converte para número
            const nota1 = parseFloat(document.getElementById('nota1').value);
            const nota2 = parseFloat(document.getElementById('nota2').value);
            const resultDiv = document.getElementById('result');

            // Validação para garantir que as notas são números válidos entre 0 e 10
            if (isNaN(nota1) || isNaN(nota2) || nota1 < 0 || nota1 > 10 || nota2 < 0 || nota2 > 10) {
                resultDiv.innerHTML = `<span style="color: var(--danger);">Por favor, insira notas válidas entre 0 e 10.</span>`;
                return; // Para a execução da função aqui
            }

            const media = (nota1 + nota2) / 2;
            let conceito = '';
            let mensagem = '';
            
            // Lógica corrigida com if/else if para faixas de notas
            if (media >= 9) {
                conceito = 'A';
                mensagem = 'Aprovado';
            } else if (media >= 7) {
                conceito = 'B';
                mensagem = 'Aprovado';
            } else if (media >= 5) {
                conceito = 'C';
                mensagem = 'Aprovado';
            } else if (media >= 3) {
                conceito = 'D';
                mensagem = 'Aprovado';
            } else {
                conceito = 'E';
                mensagem = 'Reprovado.';
            }

            // Exibe o resultado formatado dentro da div 'result'
            resultDiv.innerHTML = `
                Sua média é <strong>${media.toFixed(1)}</strong>. <br>
                Conceito: <span class="grade-${conceito}">${conceito}</span> - ${mensagem}
            `;
        });
    </script>
</body>

</html>
